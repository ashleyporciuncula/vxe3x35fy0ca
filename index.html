const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open(pw){
 const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
 const html=new TextDecoder().decode(out);document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),p=document.getElementById("p"),b=document.getElementById("b"),e=document.getElementById("e");
let saved=null;try{saved=sessionStorage.getItem("ue-pw2")}catch(_){}
if(saved)open(saved).catch(()=>{try{sessionStorage.removeItem("ue-pw2")}catch(_){}});
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="";b.disabled=true;
 try{const v=p.value;await open(v);try{sessionStorage.setItem("ue-pw2",v)}catch(_){}}
 catch(_){e.textContent="That password didn't work.";b.disabled=false;p.select()}});
}
